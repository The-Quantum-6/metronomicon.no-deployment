name: Promote Candidate to Stable and push to Docker Hub

on:
  workflow_dispatch:

jobs:
  promote-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull candidate images
        run: |
          docker pull jobau8311/metronomicon-backend:candidate
          docker pull jobau8311/metronomicon-frontend:candidate

      - name: Promote to stable
        run: |
          docker tag jobau8311/metronomicon-backend:candidate jobau8311/metronomicon-backend:stable
          docker tag jobau8311/metronomicon-frontend:candidate jobau8311/metronomicon-frontend:stable

          docker push jobau8311/metronomicon-backend:stable
          docker push jobau8311/metronomicon-frontend:stable