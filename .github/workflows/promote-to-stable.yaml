name: Promote Candidate to Stable and push to Docker Hub

on:
  workflow_dispatch:

jobs:
  promote-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull candidate images
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKERHUB_PROJECT_NAME }}-backend:candidate
          docker pull ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKERHUB_PROJECT_NAME }}-frontend:candidate

      - name: Promote to stable
        run: |
          docker tag ${{ secrets.DOCKERHUB_PROJECT_NAME }}-backend:candidate ${{ secrets.DOCKERHUB_PROJECT_NAME }}-backend:stable
          docker tag ${{ secrets.DOCKERHUB_PROJECT_NAME }}-frontend:candidate ${{ secrets.DOCKERHUB_PROJECT_NAME }}-frontend:stable

          docker push ${{ secrets.DOCKERHUB_PROJECT_NAME }}-backend:stable
          docker push ${{ secrets.DOCKERHUB_PROJECT_NAME }}-frontend:stable